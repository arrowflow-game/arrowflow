name: Release Android AAB

# Manual only - a Play Store upload is a deliberate act, not something that should
# happen on every push to main (see build-android.yml for the always-on debug APK).
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Fails the build on an undefined-variable reference. This exact class of bug
      # shipped three times and always looked like "nothing happens when you tap" -
      # most recently `stars` in game.js's onWin(), which made finishing any level
      # impossible in a release that had already passed a manual audit.
      - name: Lint (no-undef tripwire)
        run: npm run lint

      - name: Build web assets + sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.p12

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        # versionName previously fell back to a constant "1.0" on every single
        # release, so a tester's bug report could not be traced back to the code
        # it came from. Stamping the run number and the commit makes the build in
        # someone's hands identifiable from the Play listing alone.
        run: |
          export ANDROID_VERSION_NAME="1.0.$ANDROID_VERSION_CODE+$(git rev-parse --short HEAD)"
          echo "Building versionCode=$ANDROID_VERSION_CODE versionName=$ANDROID_VERSION_NAME"
          ./gradlew bundleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/upload-keystore.p12

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: arrowflow-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
