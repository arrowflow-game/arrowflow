name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'audio/**'
      - 'index.html'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Fails the build on an undefined-variable reference. This exact class of bug
      # shipped three times and always looked like "nothing happens when you tap" -
      # most recently `stars` in game.js's onWin(), which made finishing any level
      # impossible in a release that had already passed a manual audit.
      - name: Lint (no-undef tripwire)
        run: npm run lint

      - name: Build web assets + sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrowflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
