name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'audio/**'
      - 'index.html'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/build-android.yml'
      # Added 2026-09-03 alongside the rules/backup/e2e gates. Without these,
      # the one change each gate exists to catch - an edit to firestore.rules,
      # or to a test itself - would not have triggered CI at all.
      - 'tools/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package-lock.json'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Fails the build on an undefined-variable reference. This exact class of bug
      # shipped three times and always looked like "nothing happens when you tap" -
      # most recently `stars` in game.js's onWin(), which made finishing any level
      # impossible in a release that had already passed a manual audit.
      - name: Lint (no-undef tripwire)
        run: npm run lint

      # tools/e2e_smoke_test.py has existed since the early manual-verification
      # passes were formalised, but nothing ever ran it automatically - so in
      # practice it ran only when someone remembered, which is to say rarely.
      # It drives the real page in headless Chromium, which is how every feature
      # in this project has actually been verified.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # firestore.rules is the only thing stopping one player from rewriting
      # another player's data, and it has failed in production three separate
      # times - always because `request.resource` is null outside a create or
      # update, which makes a field check throw and Firestore deny. Every
      # failure was silent and only reproducible against real Firestore. The
      # emulator needs a JDK >= 21, which setup-java above already provides.
      - name: Firestore security rules
        run: npm run test:rules

      # The backup exporter is only useful if its output can actually be read
      # back - a backup nobody has restored from is a folder of files.
      - name: Firestore backup exporter
        run: npm run test:backup

      - name: End-to-end smoke test
        run: |
          python -m http.server 8000 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 0.5; done
          python tools/e2e_smoke_test.py --url http://localhost:8000

      - name: Build web assets + sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrowflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
