apply plugin: 'com.android.application'

android {
    namespace "com.arrowflowgame.puzzle"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.arrowflowgame.puzzle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Console requires versionCode to strictly increase on every upload - CI passes
        // github.run_number for release builds; local/debug builds fall back to 1.
        versionCode System.getenv("ANDROID_VERSION_CODE") ? Integer.parseInt(System.getenv("ANDROID_VERSION_CODE")) : 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing config is populated entirely from env vars set by the release CI
    // workflow (decoded from GitHub secrets) - never hardcoded here, never committed. Local/
    // debug builds have none of these set, so signingConfigs.release stays empty and unused.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
        // Fixed, committed debug keystore (2026-09-02, added for Google Sign-In setup -
        // see the cloud-save plan). Without this, Gradle's own auto-generated debug
        // keystore is used instead - fine for a local machine, but CI's ubuntu-latest
        // runner is ephemeral and has no debug.keystore of its own, so every CI-built
        // debug APK used to get a BRAND NEW random signing key with a different SHA-1
        // fingerprint. Google Sign-In's OAuth client is registered against one specific
        // SHA-1, so debug builds would only work the one time that exact fingerprint
        // happened to be registered - explicitly pointing at this checked-in keystore
        // keeps every debug build (local or CI) signed identically. Debug-only signing
        // (well-known fixed alias/passwords, same convention Android Studio itself uses
        // for its own auto-generated debug.keystore) - never used for release uploads.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
